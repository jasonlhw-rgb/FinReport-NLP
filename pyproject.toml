[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finreport-nlp"
version = "0.1.0"
description = "Large-scale NLP-based information extraction from financial reports"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FinReport-NLP Contributors" }]
keywords = ["nlp", "spaCy", "financial-reports", "information-extraction", "NER"]
dependencies = [
  "spacy>=3.8.0,<3.9.0",
  "pdfplumber>=0.11.0",
  "openpyxl>=3.1.0",
  "pandas>=2.0.0",
  "PyYAML>=6.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
