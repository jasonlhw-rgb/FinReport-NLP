model:
  lang: zh
  label: TARGET_SECTION
  epochs: 20
  batch_size: 4
  dropout: 0.2

paths:
  sample_data: data/sample/sample_training_data.json
  model_dir: models/target_section_ner
  output_dir: outputs

extraction:
